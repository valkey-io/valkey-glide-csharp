name: lint

on:
    push:
        branches:
            - main
            - release-*
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

jobs:
    lint:
        runs-on: ubuntu-latest
        timeout-minutes: 10

        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  submodules: true

            - name: Install Rust
              uses: ./valkey-glide/.github/actions/install-rust
              with:
                  target: x86_64-unknown-linux-gnu

            - name: Cache Rust
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: rust/target
                  # Use 'Cargo.toml' hash so the cache invalidates when dependencies change.
                  key: rust-lint-${{ hashFiles('rust/Cargo.toml') }}
                  # On cache miss, restore the most recent cache with this prefix so cargo
                  # only recompiles changed dependencies instead of building from scratch.
                  restore-keys: rust-lint-

            - name: Install cargo-deny
              uses: taiki-e/install-action@67729d5c413db75907f0ad1e39bb04b9c868ff60 # v2.85.7
              with:
                  tool: cargo-deny@0.19

            - name: Install actionlint
              run: |
                  curl -fsSL https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz | tar xz -C /usr/local/bin actionlint

            - name: Install dotnet
              uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
              with:
                  dotnet-version: "10"

            - name: Install uv
              uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

            - name: Install Task
              uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0

            - name: Run lint
              run: task lint
