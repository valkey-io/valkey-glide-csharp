name: check-todos

on:
    pull_request:
    workflow_dispatch:

permissions:
    contents: read
    issues: read
    pull-requests: read

jobs:
    check-todos:
        runs-on: ubuntu-latest
        timeout-minutes: 10

        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Setup Python
              uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
              with:
                  python-version: "3.12"

            - name: Install Task
              uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0

            - name: Get issues closed by this pull request
              id: closing-issues
              env:
                  GH_TOKEN: ${{ github.token }}
              if: github.event_name == 'pull_request'
              run: |
                  ISSUES=$(gh pr view ${{ github.event.pull_request.number }} \
                    --repo ${{ github.repository }} \
                    --json closingIssuesReferences \
                    --jq '[.closingIssuesReferences[].number] | join(" ")')
                  echo "issues=$ISSUES" >> "$GITHUB_OUTPUT"

            - name: Check TODOs
              run: task check:todos -- --fail-issues ${{ steps.closing-issues.outputs.issues }}
              env:
                  GH_TOKEN: ${{ github.token }}
